<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<title>ALFA</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--bg2:#121212;--ink:#ffffff;--mut:#a0a0a0;--line:#222222;--gold:#CFDAEA;--foot:#050505;--fi:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:300 15px/1.6 Montserrat,Arial,sans-serif}
h1,h2,h3,.serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500}
button{font:inherit;cursor:pointer;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);background:rgba(10,10,10,0.95);backdrop-filter:blur(10px);z-index:5;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:18px 20px}
.logo{font:500 28px 'Cormorant Garamond',serif;letter-spacing:.35em;text-align:center;cursor:pointer;padding-left:.35em}
.logo span{color:var(--gold)}
.ib{background:none;border:0;font-size:12px;letter-spacing:.2em;text-transform:uppercase;justify-self:end}
.cats{display:flex;gap:26px;overflow-x:auto;padding:18px 20px;justify-content:safe center;border-bottom:1px solid var(--line);scrollbar-width:none}
.cats button{background:none;border:0;border-bottom:1px solid transparent;padding:4px 0;font-size:12px;letter-spacing:.22em;text-transform:uppercase;white-space:nowrap;color:var(--mut)}
.cats button.on{color:var(--ink);border-color:var(--gold)}
.hero{position:relative;text-align:center;padding:160px 20px;background:#000;color:#fff;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:75vh}
.hero-media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.4;z-index:1}
.hero-content{position:relative;z-index:2;max-width:800px}
.hero h1{font-size:clamp(42px,8vw,84px);letter-spacing:.25em;margin:0;font-weight:400;text-transform:uppercase}
.hero p{letter-spacing:.4em;font-size:12px;text-transform:uppercase;color:var(--gold);margin:18px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:40px 24px;max-width:1200px;margin:0 auto;padding:60px 20px}
.card{cursor:pointer}
.ph{aspect-ratio:4/5;background:var(--bg2);overflow:hidden;position:relative;display:grid;place-items:center;color:var(--gold);font:500 30px 'Cormorant Garamond',serif;border:1px solid var(--line)}
.ph img, .ph video{width:100%;height:100%;object-fit:cover;transition:transform .7s}
.card:hover .ph img, .card:hover .ph video{transform:scale(1.04)}
.tag{position:absolute;top:12px;left:12px;background:var(--gold);color:#000;font-size:10px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;padding:4px 10px;z-index:2}
.card h3{font-size:20px;margin:16px 0 4px;letter-spacing:.04em;transition:color .3s}
.card:hover h3{color:var(--gold)}
.pr{color:var(--gold);font-size:14px;letter-spacing:.08em;font-weight:400}
.so{opacity:.6}
.btn{display:block;width:100%;background:var(--gold);color:#000;border:1px solid var(--gold);padding:16px;letter-spacing:.25em;text-transform:uppercase;font-size:11px;font-weight:500;transition:.3s;text-align:center;text-decoration:none}
.btn:hover{background:#fff;border-color:#fff;color:#000}
.btn.o{background:none;color:var(--ink);border-color:var(--line)}
.btn.o:hover{background:var(--line)}
.btn:disabled{opacity:.35;pointer-events:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);z-index:20;display:flex;justify-content:flex-end;animation:f .3s}
.ov.c{justify-content:center;align-items:center;padding:16px}
@keyframes f{from{opacity:0}}@keyframes s{from{transform:translateX(100%)}}
.dr{background:var(--bg2);width:min(460px,100%);height:100%;overflow-y:auto;padding:32px 24px;animation:s .35s;display:flex;flex-direction:column;gap:16px;border-left:1px solid var(--line)}
.md{background:var(--bg2);max-width:960px;width:100%;max-height:92vh;overflow-y:auto;display:grid;grid-template-columns:1.1fr 0.9fr;border:1px solid var(--line)}
.md>div{padding:40px 32px}
@media(max-width:700px){.md{grid-template-columns:1fr}}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.it{display:grid;grid-template-columns:70px 1fr auto;gap:16px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:16px}
.it .ph{aspect-ratio:1}
.q{display:inline-flex;border:1px solid var(--line);align-items:center;background:#000}
.q button{background:none;border:0;width:32px;height:32px}
.q span{min-width:30px;text-align:center}
input,select,textarea{width:100%;font:inherit;padding:14px;border:1px solid var(--line);background:#000;color:var(--ink);margin:6px 0 16px;transition:border-color .3s}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none}
label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);font-weight:400}
.bank{border:1px solid var(--gold);padding:20px;background:#161616;margin-bottom:16px}
.pay{display:flex;gap:10px;margin-bottom:16px}.pay button{flex:1;background:#000;border:1px solid var(--line);padding:14px;font-size:12px;text-transform:uppercase;letter-spacing:.1em}.pay .on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);color:var(--gold)}
footer{background:var(--foot);color:var(--fi);text-align:center;padding:60px 20px;border-top:1px solid var(--line)}
footer a{color:var(--mut);margin:0 14px;text-decoration:none;font-size:11px;letter-spacing:.2em;text-transform:uppercase;transition:color .3s}
footer a:hover{color:var(--gold)}
footer .logo{color:#fff;margin-bottom:24px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--gold);color:#000;font-weight:500;padding:14px 26px;font-size:13px;letter-spacing:.05em;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
.adm{max-width:1000px;margin:0 auto;padding:40px 20px}
.tabs{display:flex;gap:10px;margin-bottom:30px;flex-wrap:wrap}.tabs button{background:none;border:1px solid var(--line);padding:12px 24px;font-size:11px;letter-spacing:.15em;text-transform:uppercase;font-weight:500}.tabs .on{background:var(--gold);color:#000;border-color:var(--gold)}
.hero i{display:block;width:50px;height:1px;background:var(--gold);margin:32px auto 0}
.hero .btn{display:inline-block;width:auto;padding:16px 48px;margin-top:38px;background:none;color:#fff;border-color:var(--gold)}
.hero .btn:hover{background:var(--gold);color:#000}
.sec{text-align:center;font-size:36px;letter-spacing:.25em;text-transform:uppercase;margin:100px 20px 20px;font-weight:400}
.sec:after{content:'';display:block;width:40px;height:1px;background:var(--gold);margin:20px auto 0}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:40px;max-width:1100px;margin:0 auto;padding:80px 20px;text-align:center;border-top:1px solid var(--line)}
.trust b{display:block;font:500 22px 'Cormorant Garamond',serif;letter-spacing:.1em;margin-bottom:6px;color:var(--gold)}.trust span{font-size:13px;color:var(--mut)}
.wa{position:fixed;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));background:#25D366;color:#fff;border:0;padding:14px 24px;font-size:12px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;text-decoration:none;z-index:9;box-shadow:0 8px 24px rgba(0,0,0,0.3)}
.dove{position:fixed;left:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:9;display:flex;align-items:center;gap:10px;background:#111;border:1px solid var(--gold);border-radius:40px;padding:8px 20px 8px 12px;font-size:11px;letter-spacing:.15em;text-transform:uppercase;box-shadow:0 8px 24px rgba(0,0,0,0.4);color:#fff}
.dove svg{animation:fly 3s ease-in-out infinite}.dove .w{transform-origin:34px 36px;animation:flap .7s ease-in-out infinite alternate}
@keyframes fly{50%{transform:translateY(-5px) rotate(-5deg)}}@keyframes flap{from{transform:rotate(-24deg)}to{transform:rotate(10deg)}}
.stars{display:flex;gap:6px;margin:6px 0 16px}.stars button{background:none;border:0;font-size:32px;color:var(--line);padding:0}.stars .on{color:var(--gold)}
.com{border-bottom:1px solid var(--line);padding:16px 0}
.x{position:absolute;top:16px;right:20px;background:none;border:0;font-size:28px;color:var(--mut);cursor:pointer}.x:hover{color:#fff}


/* ===== Efectos y animaciones ===== */
@keyframes rise{from{opacity:0;transform:translateY(34px)}}
@keyframes pop{from{opacity:0;transform:translateY(26px) scale(.96)}}
@keyframes settle{from{transform:scale(1.18)}}
@keyframes grow{from{width:0}}
@keyframes bump{40%{transform:scale(1.4)}}
@keyframes pulse{0%{box-shadow:0 8px 24px rgba(0,0,0,.3),0 0 0 0 rgba(37,211,102,.5)}70%,100%{box-shadow:0 8px 24px rgba(0,0,0,.3),0 0 0 16px rgba(37,211,102,0)}}
@keyframes ti{from{opacity:0;translate:0 20px}}
@keyframes rv2{from{opacity:0;translate:0 44px}to{opacity:1;translate:0 0}}
.logo{transition:letter-spacing .6s cubic-bezier(.2,.7,.2,1)}.logo:hover{letter-spacing:.43em}
.cats button{position:relative;transition:color .3s}
.cats button::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.cats button:hover{color:var(--ink)}.cats button:hover::after,.cats button.on::after{transform:scaleX(1)}
.ib.bump{animation:bump .55s}
.hero-media{transform:translateY(calc(var(--sy,0)*.18px)) scale(1.1);will-change:transform}
.hero-content{transform:translateY(calc(var(--sy,0)*.1px));opacity:calc(1 - var(--sy,0)/850)}
.intro .hero-content>*{animation:rise 1.1s cubic-bezier(.2,.7,.2,1) backwards}
.intro .hero-content>:nth-child(1){animation-delay:.1s}.intro .hero-content>:nth-child(2){animation-delay:.3s}.intro .hero-content>:nth-child(3){animation-delay:.55s}.intro .hero-content>:nth-child(4){animation-delay:.75s}.intro .hero-content>:nth-child(5){animation-delay:.95s}
.intro .hero i{animation:grow 1.2s .55s cubic-bezier(.2,.7,.2,1) backwards}
.card{transform:perspective(900px) translateY(var(--ty,0)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .35s cubic-bezier(.2,.7,.2,1);will-change:transform}
.card:hover{--ty:-10px}.card:active{--ty:-3px;filter:brightness(.9)}
.card .ph{transition:border-color .4s,box-shadow .5s}
.card:hover .ph{border-color:var(--gold);box-shadow:0 28px 42px -24px rgba(190,215,255,.5)}
.card .ph img,.card .ph video{transition:transform 1s cubic-bezier(.2,.7,.2,1),filter .5s}
.card:hover .ph img,.card:hover .ph video{transform:scale(1.09);filter:brightness(1.06) contrast(1.03)}
.card .ph::before{content:'';position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-18deg);transition:left .9s;z-index:2;pointer-events:none}
.card:hover .ph::before{left:140%}
.card .ph::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(190,215,255,.26),transparent 55%);opacity:0;transition:opacity .4s;pointer-events:none;z-index:1}
.card:hover .ph::after{opacity:1}
.qv{position:absolute;left:0;right:0;bottom:0;padding:34px 10px 14px;text-align:center;font:400 10px Montserrat,sans-serif;letter-spacing:.32em;text-transform:uppercase;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.78));transform:translateY(101%);transition:transform .5s cubic-bezier(.2,.7,.2,1);z-index:3}
.card:hover .qv{transform:none}
.card h3{transition:color .3s,letter-spacing .5s cubic-bezier(.2,.7,.2,1),transform .5s cubic-bezier(.2,.7,.2,1)}
.card:hover h3{letter-spacing:.09em;transform:translateX(5px)}
.pr{transition:transform .5s cubic-bezier(.2,.7,.2,1)}.card:hover .pr{transform:translateX(5px)}
.btn{position:relative;overflow:hidden}
.btn:not(.o)::before{content:'';position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);transition:left .75s;pointer-events:none}
.btn:not(.o):hover::before{left:140%}
.btn:active{transform:scale(.97)}
.md{animation:pop .55s cubic-bezier(.2,.8,.2,1)}
.md .ph img,.md .ph video{animation:settle 1.4s cubic-bezier(.2,.7,.2,1)}
.md>div+div>*{animation:rise .7s cubic-bezier(.2,.7,.2,1) backwards}
.md>div+div>*:nth-child(1){animation-delay:0.19s}.md>div+div>*:nth-child(2){animation-delay:0.26s}.md>div+div>*:nth-child(3){animation-delay:0.33s}.md>div+div>*:nth-child(4){animation-delay:0.40s}.md>div+div>*:nth-child(5){animation-delay:0.47s}.md>div+div>*:nth-child(6){animation-delay:0.54s}.md>div+div>*:nth-child(7){animation-delay:0.61s}
.dr .it{animation:rise .55s cubic-bezier(.2,.7,.2,1) backwards}
.dr .it:nth-child(2){animation-delay:0.00s}.dr .it:nth-child(3){animation-delay:0.06s}.dr .it:nth-child(4){animation-delay:0.12s}.dr .it:nth-child(5){animation-delay:0.18s}.dr .it:nth-child(6){animation-delay:0.24s}.dr .it:nth-child(7){animation-delay:0.30s}.dr .it:nth-child(8){animation-delay:0.36s}.dr .it:nth-child(9){animation-delay:0.42s}
.wa{animation:pulse 2.8s infinite;transition:transform .3s}.wa:hover{transform:translateY(-3px)}
.toast{animation:ti .4s cubic-bezier(.2,.7,.2,1)}
@supports(animation-timeline:view()){
  .card,.sec,.trust>div{animation:rv2 linear both;animation-timeline:view();animation-range:entry 0% entry 38%}
}
@media(hover:none){.qv{display:none}.card:hover{--ty:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
#pa{display:none}
.lb{width:100mm;min-height:150mm;border:2px dashed #000;padding:5mm;color:#000;background:#fff;font:400 12px/1.35 Arial,Helvetica,sans-serif;margin:0 auto;display:flex;flex-direction:column;gap:3mm;box-sizing:border-box}
.lb small{display:block;font-size:9px;letter-spacing:.15em;text-transform:uppercase;margin-top:2px}
.lb .h{display:flex;justify-content:space-between;gap:8px;border-bottom:2px solid #000;padding-bottom:3mm}
.lb .l1{font:700 18px 'Cormorant Garamond',Georgia,serif;letter-spacing:.18em}
.lb .to{border:2px solid #000;padding:4mm}
.lb .to .n{display:block;font-size:21px;line-height:1.15;margin:2px 0 4px;text-transform:uppercase}
.lb .cp{font:700 30px/1.1 Arial;letter-spacing:.06em;margin-top:4px}
.lb .cod{border:3px solid #000;padding:3mm;text-align:center;font-weight:700;font-size:16px;margin-top:auto}
@media print{#pa .lb{margin:0}}
@media print{html,body{background:#fff!important}body>*:not(#pa){display:none!important}#pa{display:block!important;padding:10mm}#pa .np{box-shadow:none;width:150mm;max-width:100%;margin:0 auto}@page{margin:8mm}}

/* ===== ALFA · Negro + plata neón brillante ===== */
:root{
  --bg:#000;--bg2:#070707;--foot:#000;--line:#2a3345;
  --gold:#E8F0FF;--gold2:#FFFFFF;--gold3:#9FB2D0;
  --ink:#F4F8FF;--mut:#B8C6DA;--silver:#F2F7FF;
  --glow:0 0 2px #fff,0 0 8px rgba(215,230,255,.95),0 0 22px rgba(140,185,255,.75),0 0 46px rgba(100,150,255,.45);
  --glowbox:0 0 8px rgba(215,230,255,.7),0 0 24px rgba(140,185,255,.45),inset 0 0 10px rgba(200,220,255,.12);
}
body{background:#000;color:var(--ink)}
.hero{background:radial-gradient(ellipse at 50% 0,#10192b,#000 70%)}
.hero-media{opacity:.32}
.hero i{width:120px;height:2px;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 10px #fff,0 0 22px rgba(150,190,255,.9)}
.sec:after{width:80px;height:2px;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 10px #fff,0 0 22px rgba(150,190,255,.9)}

/* Texto con brillo neón */
.logo,.hero h1,footer .logo,.sec,.trust b,.card h3,h2{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--silver)!important;text-shadow:var(--glow)}
.hero p,.pr,.ib,.cats button.on,.cats button:hover,footer a:hover{color:var(--silver);text-shadow:0 0 6px rgba(215,230,255,.9),0 0 18px rgba(140,185,255,.6)}
.cats button{color:var(--mut)}
.trust b,[style*="color:var(--gold)"]:not(.stars):not(.tag){color:var(--silver)!important}
.card:hover h3{color:#fff!important;text-shadow:0 0 4px #fff,0 0 14px #cfe0ff,0 0 34px #7fa8ff}
.cats button::after{box-shadow:0 0 8px rgba(215,230,255,.95)}

/* Líneas y bordes encendidos */
header,footer,.cats,.trust{border-color:#3a4a66;box-shadow:0 1px 16px -6px rgba(170,205,255,.6)}
.ph,.md,.dr,.bank,.q,.com{border-color:#44567a}
.card:hover .ph{border-color:#fff;box-shadow:var(--glowbox),0 28px 46px -24px rgba(150,190,255,.7)}

/* Botones plateados brillantes */
.btn,.hero .btn{background:linear-gradient(135deg,#aebbd3,#ffffff 50%,#c9d8f0);color:#000;border-color:#fff;box-shadow:var(--glowbox)}
.btn:hover{background:#fff;border-color:#fff;box-shadow:0 0 12px #fff,0 0 34px rgba(150,195,255,.95)}
.btn.o{background:transparent;color:var(--silver);border-color:#6a7fa6;box-shadow:none}
.btn.o:hover{border-color:#fff;box-shadow:var(--glowbox);background:rgba(200,220,255,.08)}
.hero .btn{background:transparent;color:var(--silver)}
.hero .btn:hover{background:#fff;color:#000}

/* Elementos flotantes y formularios */
.wa{background:linear-gradient(135deg,#aebbd3,#fff,#c9d8f0);color:#000;border:1px solid #fff;box-shadow:var(--glowbox);animation:none}
.dove{background:#000;border-color:#fff;box-shadow:var(--glowbox)}
.tag,.tabs .on,.toast{background:#fff;color:#000;box-shadow:0 0 12px #fff,0 0 28px rgba(150,190,255,.8)}
.pay .on{border-color:#fff;color:#fff;box-shadow:var(--glowbox)}
input,select,textarea{background:#000;border-color:#3a4a66}
input:focus,select:focus,textarea:focus{border-color:#fff;box-shadow:0 0 12px rgba(190,215,255,.8)}
.stars .on{color:#fff;text-shadow:0 0 10px rgba(190,215,255,.95)}
.card{will-change:auto}.card:hover{will-change:transform}
/* ===== Menos espacio entre portada y colección ===== */
.hero{padding:110px 20px 40px;min-height:62vh}
.sec{margin-top:36px}
@media(max-width:700px){.hero{padding:90px 20px 30px;min-height:56vh}.sec{margin-top:28px;font-size:30px}}
/* ===== Buscador ===== */
.srch{max-width:560px;margin:26px auto 0;padding:0 20px}
.srch input{margin:0;border-radius:40px;padding:14px 22px 14px 52px;letter-spacing:.08em;background:#000 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23E8F0FF' stroke-width='2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='M20 20l-4-4'/></svg>") no-repeat 20px center;background-size:20px;border-color:#44567a;box-shadow:0 0 10px rgba(190,215,255,.25)}
.srch input::placeholder{color:var(--mut);opacity:.85}
/* ===== Logos de redes sociales ===== */
.ic{width:1.35em;height:1.35em;vertical-align:-.3em;margin-right:9px;fill:currentColor;flex:none;filter:drop-shadow(0 0 3px rgba(215,230,255,.9)) drop-shadow(0 0 8px rgba(140,185,255,.6))}
.ic.s{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
label .ic{width:1.5em;height:1.5em;margin-right:10px}
footer a .ic{margin-right:8px}
.wa .ic{filter:none;margin-right:8px}
footer a{display:inline-flex;align-items:center}
footer a .ic{width:1.7em;height:1.7em;margin-right:10px}
.ic{transform-origin:50% 50%}
@keyframes brinco{0%{transform:translateY(0) rotate(0)}35%{transform:translateY(-9px) rotate(180deg)}70%{transform:translateY(0) rotate(360deg)}85%{transform:translateY(-3px) rotate(360deg)}100%{transform:translateY(0) rotate(360deg)}}
footer a:hover .ic,.wa:hover .ic,label:hover .ic{animation:brinco .75s cubic-bezier(.3,.7,.3,1)}

/* ===== ALFA estilo videojuego ===== */
.hero h1.gm{cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.intro .hero-content>h1.gm{animation:hit .55s 1.5s}
.hero-content>h1.gm.play{animation:hit .55s 1.3s}
.gm.play span{display:inline-block;animation:slam .85s cubic-bezier(.2,.9,.25,1.15) backwards}

  [0,.25,.5,.75].forEach((dl,i)=>{const hit=t0+dl+.47;
    noise(hit-.45,.45,300,3500,.3,'bandpass');
    tone(hit,'sine',150-i*8,38,.9,.35);

  const fin=t0+1.3;

async function doSearch(q){

  const ws=nq.split(' ').filter(Boolean);
  if(!LIVE){SR={q:nq,ids:D.products.filter(p=>ws.every(w=>hay(p).includes(w))).map(p=>p.id),busy:false};soft();return}
  const loc=()=>Object.values(PM).filter(p=>ws.every(w=>hay(p).includes(w))).map(p=>p.id);
  SR={q:nq,ids:loc().sort().reverse(),busy:true};soft();
  try{
    const t=ws.reduce((a,b)=>b.length>a.length?b:a,'').slice(0,20);

}

async function takeStock(its){
  for(const i of its){try{await runTransaction(db,async t=>{
    const r=doc(db,'products',i.p.id),s=await t.get(r);if(!s.exists())return;
    const q=s.data().qty;if(q==null)return;const n=Math.max(0,q-i.q);
    t.update(r,{qty:n,so:n<=0});PM[i.p.id]={...PM[i.p.id],qty:n,so:n<=0}})}catch(e){}}
}
async function confirmOrder(){
  const n=$('#f-n').value.trim(),t=$('#f-t').value.trim(),a=$('#f-a').value.trim(),o=$('#f-o').value.trim(),es=$('#f-e').value,cp=$('#f-c').value.trim();
  if(!n||!t||!a||!es||!/^\d{5}$/.test(cp)){toast('Completa nombre, teléfono, estado, código postal (5 dígitos) y dirección');return}
  const its=items();if(!its.length){toast('Tu bolsa está vacía');return}
  const bad=its.find(i=>i.p.qty!=null&&i.q>i.p.qty);if(bad){toast('Solo quedan '+bad.p.qty+' de '+bad.p.n);return}
  if(!codOk(es))pay='transfer';
  const sh=shipCost(),list=its.map(i=>({q:i.q,n:i.p.n,t:i.p.p*i.q}));if(sh>0)list.push({q:1,n:'Envío a '+es,t:sh});
  const lines=list.map(i=>`• ${i.q} x ${i.n} — ${money(i.t)}`).join('\n');
  const order={name:n,phone:t,address:`${a}, CP ${cp}, ${es}`,notes:o,pay,total:total()+sh,items:lines,at:Date.now()};
  lastOrder={...order,list};notaBlob=null;
  done=notaText(lastOrder);
  makeNota(lastOrder).then(b=>{notaBlob=b}).catch(()=>{});
  try{fetch('/api/pedido',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:done}),keepalive:true}).catch(()=>{})}catch(e){}
  if(!openWA(done))toast('Presiona «Enviar pedido por WhatsApp» para mandar tu pedido');
  try{await FB.addOrder(order)}catch(e){}
  await takeStock(its);
  cart={};save();view='done';render();
}

/* Cierre de sesión automático tras 15 min sin actividad */
const armIdle=()=>{clearTimeout(idle);if(user)idle=setTimeout(()=>{if(au)signOut(au)},15*60000)};
['click','keydown','pointermove'].forEach(ev=>addEventListener(ev,armIdle,{passive:true}));

if(LIVE){
  const app=initializeApp(firebaseConfig);try{db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){db=getFirestore(app)}au=getAuth(app);D.products=[];
  Object.keys(PM).forEach(k=>delete PM[k]);loadMore('Todo');
  onSnapshot(doc(db,'config','store'),s=>{if(s.exists()){D.cfg={...D.cfg,...s.data()};fixCats();soft()}},()=>{});
  let un=[];
  onAuthStateChanged(au,u=>{
    /* Solo los correos de los administradores pueden mantener sesión */
    if(u&&!ADMIN_EMAILS.map(x=>x.toLowerCase()).includes((u.email||'').toLowerCase())){signOut(au);toast('Acceso no autorizado');return}
    user=u;armIdle();un.forEach(f=>f());un=[];if(u)resetPG();
    if(u&&!migDone)setTimeout(()=>{if(!migDone&&Object.values(PM).some(p=>!Array.isArray(p.k))){migDone=true;migrateSearch()}},3000);
    if(u){un.push(onSnapshot(query(collection(db,'orders'),orderBy('at','desc'),limit(50)),s=>{orders=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.at-a.at);soft()},()=>{}),onSnapshot(query(collection(db,'comments'),orderBy('t','desc'),limit(100)),s=>{allComs=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.t-a.t);soft()},()=>{}))}
    soft()});
}

on class="btn o" style="max-width:280px" data-a="migr">Optimizar fotos anteriores</button><h2 style="margin-top:40px">Buscador</h2><p style="color:var(--mut);font-size:13px">Activa la búsqueda en los productos que subiste antes. Hazlo una sola vez; los productos nuevos ya la incluyen.</p><button class="btn o" style="max-width:320px" data-a="msearch">Activar búsqueda en productos anteriores</button><h2 style="margin-top:40px">Borrar todos los productos</h2><p style="color:var(--mut);font-size:13px">Deja la tienda sin productos para empezar de cero. Pide confirmación dos veces y no se puede deshacer.</p><button class="btn o" style="max-width:320px;color:#e07b7b;border-color:#5a2e2e" data-a="wipe">Borrar todos los productos</button>`;

const fileToBase64=f=>new Promise((resolve,reject)=>{
  const r=new FileReader();
  r.readAsDataURL(f);
  r.onload=()=>resolve(r.result);
  r.onerror=e=>reject(e);
});

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  if(el.classList.contains('ov')&&e.target!==el)return;
  const a=el.dataset.a,v=el.dataset.v;
  try{
    if(a==='alfa'){playAlfa();return}
    else if(a==='wa'){e.preventDefault();openWA();return}
    else if(a==='sendwa'){openWA(done);return}
    else if(a==='sharenota'){shareNota();return}
    else if(a==='printnota'){printNota(lastOrder);return}
    else if(a==='oprint'){printNota(orderObj(orders[+v]));return}
    else if(a==='olabel'){printLabel(orderObj(orders[+v]));return}
    else if(a==='odel'){const o=orders.find(x=>x.id===v);if(o&&confirm('¿Eliminar el pedido de '+o.name+'? Esta acción no se puede deshacer.'))await deleteDoc(doc(db,'orders',v));return}
    else if(a==='wipe'){await wipeProducts();return}
    else if(a==='msearch'){await migrateSearch();return}
    else if(a==='more'){loadMore(admin?'Todo':cat);return}
    else if(a==='shop'){$('#col').scrollIntoView({behavior:'smooth'});return}
    else if(a==='home'){cat='Todo';view=null;sq='';SR={q:'',ids:[],busy:false}}
    else if(a==='cat'){cat=v;sq='';SR={q:'',ids:[],busy:false};if(LIVE&&!PG[v])loadMore(v)}
    else if(a==='prod'){view='p:'+v;loadFull(v)}
    else if(a==='cart')view='cart';
    else if(a==='com'){view='com';loadComs()}
    else if(a==='close')view=null;
    else if(a==='star'){star=+v;document.querySelectorAll('.stars button').forEach((b,i)=>b.className=i<star?'on':'');return}
    else if(a==='csend'){const n=$('#k-n').value.trim(),t=$('#k-t').value.trim();if(!n||!t){toast('Escribe tu nombre y comentario');return}
      await addDoc(collection(db,'comments'),{name:n.slice(0,40),text:t.slice(0,400),stars:star,ok:false,t:Date.now()});toast('¡Gracias! Tu opinión se publicará al ser revisada');view=null}
    else if(a==='add'){const q0=(prod(v)||{}).qty;if(q0!=null&&(cart[v]||0)>=q0){toast('Solo hay '+q0+' en existencia');return}cart[v]=(cart[v]||0)+1;if(PM[v])cartP[v]=slim(PM[v]);save();view='cart';toast('Agregado a la bolsa')}
    else if(a==='inc'){const q0=(prod(v)||{}).qty;if(q0!=null&&cart[v]>=q0){toast('Solo hay '+q0+' en existencia');return}cart[v]++;save()}
    else if(a==='dec'){cart[v]--;if(cart[v]<1)delete cart[v];save()}
    else if(a==='del'){delete cart[v];save()}
    else if(a==='checkout'){await refreshCart();view='checkout';shipState=''}
    else if(a==='pay'){if(v==='cash'&&shipState&&!codOk(shipState)){toast('El pago al entregar solo está disponible en: '+D.cfg.codEstados);return}keepForm(()=>{pay=v});return}
    else if(a==='copy'){try{await navigator.clipboard.writeText(D.cfg.clabe);toast('CLABE copiada')}catch(x){toast('Copia el número manualmente')}return}
    else if(a==='confirm'){await confirmOrder();return}
    else if(a==='exit'){admin=false;location.hash='';edit=null}
    else if(a==='login'){
      if(Date.now()<lockUntil){toast('Demasiados intentos. Espera 15 minutos');return}
      try{await signInWithEmailAndPassword(au,$('#l-m').value.trim(),$('#l-p').value);fails=0}
      catch(x){if(++fails>=5){lockUntil=Date.now()+15*60000;fails=0}toast('Credenciales incorrectas')}
      return}
    else if(a==='logout'){await signOut(au)}
    else if(a==='tab'){tab=v;edit=null}
    else if(a==='pnew')edit={id:'',n:'',m:'',p:0,qty:null,c:D.cfg.cats[0],d:'',img:'',so:false,mediaType:'image'};
    else if(a==='pedit')edit={...prod(v)};
    else if(a==='pcancel')edit=null;
    else if(a==='pso'){const p0=PM[v];await updateDoc(doc(db,'products',v),{so:!p0.so});p0.so=!p0.so;render();return}
    else if(a==='pdel'){if(confirm('¿Borrar este producto?')){await deleteDoc(doc(db,'products',v));deleteDoc(doc(db,'images',v)).catch(()=>{});Object.values(PG).forEach(g=>{g.ids=g.ids.filter(x=>x!==v)});delete PM[v];render()}return}
    else if(a==='psave'){const p=edit;p.n=$('#e-n').value.trim();p.m=$('#e-m').value.trim();p.p=Number($('#e-p').value)||0;p.c=$('#e-c').value;p.d=$('#e-d').value;const qv=$('#e-q').value.trim();p.qty=qv===''?null:Math.max(0,parseInt(qv)||0);p.so=$('#e-s').checked||(p.qty!==null&&p.qty<=0);
      if(!p.n){toast('Escribe el nombre');return}
      const id=p.id||('p'+Date.now());let hf=p.hf||false,img=p.img||'';
      if(p.full){try{await setDoc(doc(db,'images',id),{d:p.full});hf=true}catch(x){hf=false;img=p.full;toast('Guardado sin fotos separadas: actualiza las reglas de Firebase')}}
      if(p.mediaType==='video')hf=false;
      const dat={n:p.n,m:p.m||'',k:kws(p),p:p.p,c:p.c,d:p.d,img,so:p.so,qty:p.qty==null?null:p.qty,mediaType:p.mediaType||'image',hf,t:p.t||Date.now()};await setDoc(doc(db,'products',id),dat);PM[id]={id,...dat};delete FULL[id];resetPG();edit=null;toast('Guardado')}
    else if(a==='migr'){await migrate();return}
    else if(a==='cok'){await updateDoc(doc(db,'comments',v),{ok:!allComs.find(k=>k.id===v).ok});return}
    else if(a==='cdel'){await deleteDoc(doc(db,'comments',v));return}
    else if(a==='csave'){const g=i=>$('#c-'+i).value.trim(),c={...D.cfg};
      c.wa=g('wa').replace(/\D/g,'');c.bank=g('bank');c.holder=g('holder');c.clabe=g('clabe');c.mail=g('mail');c.ig=g('ig');c.fb=g('fb');c.tt=g('tt');c.ship=Number(g('ship'))||0;c.shipFree=Number(g('shipfree'))||0;c.codEstados=g('cod');c.sname=g('sname');c.saddr=g('saddr');c.cats=g('cats').split(',').map(s=>s.trim()).filter(Boolean);
      await setDoc(doc(db,'config','store'),c);toast('Ajustes guardados');return}
  }catch(x){toast('Ocurrió un error, intenta de nuevo')}
  render();
});

document.addEventListener('change',async e=>{
  if(e.target.id==='f-e'){keepForm(()=>{shipState=e.target.value;if(!codOk(shipState))pay='transfer'});return}
  if(e.target.id==='f-img' && e.target.files[0]){
    toast('Procesando archivo…');
    const f=e.target.files[0];
    if(f.type.startsWith('video/')&&f.size>700000){toast('Video muy pesado (máx. ~700 KB). Usa una imagen o un video más corto.');e.target.value='';return}
    const type=f.type.startsWith('video/')?'video':'image';
    const pr=await toPair(f);
    if(pr){edit.img=pr.thumb;edit.full=pr.full}else{edit.img=await fileToBase64(f);edit.full=null}
    edit.mediaType=type;
    edit.n=$('#e-n').value;edit.m=$('#e-m').value;edit.p=Number($('#e-p').value)||0;edit.c=$('#e-c').value;edit.d=$('#e-d').value;edit.so=$('#e-s').checked;
    {const qv=$('#e-q').value.trim();edit.qty=qv===''?null:parseInt(qv)||0}
    render();
  }
  if(e.target.id==='f-hero' && e.target.files[0]){
    toast('Subiendo multimedia de portada…');
    const f=e.target.files[0];
    if(f.type.startsWith('video/')&&f.size>700000){toast('Video muy pesado (máx. ~700 KB). Usa una imagen o un video más corto.');e.target.value='';return}
    const base64=await toData(f,1600);
    D.cfg.heroMedia=base64;
    await setDoc(doc(db,'config','store'),D.cfg);
    toast('Multimedia de portada actualizada');
    render();
  }
});

document.addEventListener('input',e=>{if(e.target.id!=='s-q')return;clearTimeout(st);const v=e.target.value;st=setTimeout(()=>doSearch(v),450)});
window.addEventListener('hashchange',()=>{admin=location.hash===ADMIN_HASH;render()});
render();
